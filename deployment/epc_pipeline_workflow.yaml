main:
  params: [input]
  steps:
    - init:
        assign:
          - service_url: "https://epc-pipeline-service-546363762178.us-east1.run.app"
          - ticket_id: ${input.ticket_id}
          - raw_text: ${input.raw_text}
          - source: ${input.source}
          - timestamp: ${input.timestamp}

    - extract_step:
        call: http.post
        args:
          url: ${service_url + "/extract"}
          body:
            ticket_id: ${ticket_id}
            raw_text: ${raw_text}
            source: ${source}
            timestamp: ${timestamp}
        result: extract_result

    - cluster_step:
        call: http.post
        args:
          url: ${service_url + "/cluster"}
          body:
            ticket_id: ${ticket_id}
        result: cluster_result

    - assign_cluster_id:
        assign:
          - cluster_id: ${cluster_result.body.cluster_id}

    - score_step:
        call: http.post
        args:
          url: ${service_url + "/score"}
          body:
            cluster_id: ${cluster_id}
        result: score_result

    - prepare_step:
        call: http.post
        args:
          url: ${service_url + "/prepare"}
          body:
            cluster_id: ${cluster_id}
        result: prepare_result

    - return_result:
        return:
          ticket_id: ${ticket_id}
          cluster_id: ${cluster_id}
          escalated: ${prepare_result.body.escalated}
